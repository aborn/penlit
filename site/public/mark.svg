<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 60 904 904">
  <!-- 笔点 Penlit 主 Logo 母版（浅色）
       故事：笔在书写，笔尖的"点"被点亮 —— 用笔点亮价值。
       品牌色：主蓝 #3355EE / 光点黄 #FFD600 / 橡皮周蓝 #C4CEFF / 墨黑 #1A1A1A / 米白底 #F5F0E8 -->

  <g transform="rotate(45 512 512)">
    <!-- 光点辉光（两层低透明度） -->
    <circle cx="512" cy="880" r="260" fill="#FFD600" opacity="0.10"/>
    <circle cx="512" cy="880" r="185" fill="#FFD600" opacity="0.18"/>

    <!-- 橡皮帽（浅周蓝，圆角顶） -->
    <rect x="402" y="64" width="220" height="140" rx="28" ry="28" fill="#C4CEFF"/>
    <!-- 笔身（主蓝） -->
    <rect x="402" y="196" width="220" height="484" fill="#3355EE"/>
    <!-- 笔尖外三角（主蓝） -->
    <path d="M402 680 L622 680 L512 850 Z" fill="#3355EE"/>
    <!-- 笔尖石墨（墨黑） -->
    <path d="M452 706 L572 706 L512 850 Z" fill="#1A1A1A"/>

    <!-- 光点（放大后的"点"，品牌核心元素） -->
    <circle cx="512" cy="880" r="88" fill="#FFD600"/>

    <!-- 三道光芒（朝笔尖外侧发散） -->
    <g stroke="#FFD600" stroke-width="34" stroke-linecap="round">
      <line x1="512" y1="1000" x2="512" y2="1052"/>
      <line x1="427" y1="965"  x2="390" y2="1002"/>
      <line x1="597" y1="965"  x2="634" y2="1002"/>
    </g>
  </g>
</svg>
